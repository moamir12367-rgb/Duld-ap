name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ko permission do
        run: chmod +x gradlew

      - name: Debug APK banao
        run: ./gradlew assembleDebug

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: MilkmanPRO-APK
          path: app/build/outputs/apk/debug/*.apk
